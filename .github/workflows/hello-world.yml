name: Hello World

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sundays at midnight UTC

# Cancel in-progress runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions
permissions:
  contents: read
  attestations: write
  id-token: write
  pull-requests: write

jobs:
  greet:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    outputs:
      timestamp: ${{ steps.set-output.outputs.timestamp }}
      run-id: ${{ github.run_id }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025-vs2026]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set timestamp output
        id: set-output
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
        shell: bash
      
      - name: Say Hello
        run: echo "Hello, World! 👋 from ${{ matrix.os }}"
      
      - name: Display environment
        run: |
          echo "Running on: $(uname -a)"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
        shell: bash
      
      - name: Create artifact
        run: |
          echo "Hello from ${{ runner.os }}!" > hello-${{ runner.os }}.txt
          echo "Build time: $(date)" >> hello-${{ runner.os }}.txt
        shell: bash
      
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: greeting-${{ runner.os }}
          path: hello-${{ runner.os }}.txt
          retention-days: 7
      
      - name: Attest artifact
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: hello-${{ runner.os }}.txt
      
      - name: Generate job summary
        if: always()
        run: |
          echo "## Hello World Workflow 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "**OS:** ${{ runner.os }} ${{ runner.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        shell: bash
  
  combine:
    name: Combine Greetings
    needs: greet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      summary: ${{ steps.create-summary.outputs.summary }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      
      - name: Combine greetings
        id: create-summary
        run: |
          echo "# Combined Greetings from All Platforms" > combined.txt
          echo "" >> combined.txt
          echo "Build started at: ${{ needs.greet.outputs.timestamp }}" >> combined.txt
          echo "Run ID: ${{ needs.greet.outputs.run-id }}" >> combined.txt
          echo "" >> combined.txt
          for file in artifacts/*/hello-*.txt; do
            echo "---" >> combined.txt
            cat "$file" >> combined.txt
            echo "" >> combined.txt
          done
          cat combined.txt
          
          # Set output for other jobs
          echo "summary=Successfully combined greetings from all platforms" >> $GITHUB_OUTPUT
      
      - name: Upload combined artifact
        uses: actions/upload-artifact@v7
        with:
          name: combined-greetings
          path: combined.txt
          retention-days: 7
      
      - name: Summary
        run: |
          echo "## Combined Results 📦" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat combined.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
  
  comment-pr:
    name: Comment on PR
    if: github.event_name == 'pull_request'
    needs: [greet, combine]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Download combined artifact
        uses: actions/download-artifact@v8
        with:
          name: combined-greetings
      
      - name: Create PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const combined = fs.readFileSync('combined.txt', 'utf8');
            
            const comment = `## 🎉 Hello World Workflow Complete!
            
            **Status:** ✅ All platforms passed
            **Run ID:** ${{ github.run_id }}
            **Timestamp:** ${{ needs.greet.outputs.timestamp }}
            
            <details>
            <summary>📦 Combined Greetings</summary>
            
            \`\`\`
            ${combined}
            \`\`\`
            
            </details>
            
            ${{ needs.combine.outputs.summary }}
            
            [View full workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
  
  notify-failure:
    name: Notify on Failure
    if: failure()
    needs: [greet, combine]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Log failure
        run: |
          echo "::error::Workflow failed! Check the logs for details."
          echo "## ❌ Workflow Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View failed run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
  
  cache-demo:
    name: Cache Demo
    needs: combine
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Cache demo files
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/demo
          key: demo-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            demo-cache-${{ runner.os }}-
      
      - name: Create cached content
        run: |
          mkdir -p ~/.cache/demo
          echo "Cached at: $(date)" > ~/.cache/demo/timestamp.txt
          echo "Run ID: ${{ github.run_id }}" >> ~/.cache/demo/timestamp.txt
          cat ~/.cache/demo/timestamp.txt
      
      - name: Cache summary
        run: |
          echo "## 💾 Cache Demo" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Demonstrated caching with key: \`demo-cache-${{ runner.os }}-${{ github.run_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "In a real workflow, this would cache dependencies, build artifacts, or other reusable data." >> $GITHUB_STEP_SUMMARY
