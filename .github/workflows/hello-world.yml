name: Hello World

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      os-selection:
        description: 'Operating systems to run on'
        required: false
        type: choice
        options:
          - 'all'
          - 'ubuntu-only'
          - 'macos-only'
          - 'windows-only'
        default: 'all'
      custom-message:
        description: 'Custom greeting message'
        required: false
        default: 'Hello, World!'
        type: string
      enable-deployment:
        description: 'Run deployment job (requires approval)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sundays at midnight UTC

# Cancel in-progress runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions
permissions:
  contents: read
  attestations: write
  id-token: write
  pull-requests: write

jobs:
  greet:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    outputs:
      timestamp: ${{ steps.set-output.outputs.timestamp }}
      run-id: ${{ github.run_id }}
      duration: ${{ steps.performance.outputs.duration }}
    strategy:
      matrix:
        os: ${{
          (github.event_name == 'workflow_dispatch' && inputs.os-selection == 'ubuntu-only'
            && fromJSON('["ubuntu-latest"]')) ||
          (github.event_name == 'workflow_dispatch' && inputs.os-selection == 'macos-only'
            && fromJSON('["macos-latest"]')) ||
          (github.event_name == 'workflow_dispatch' && inputs.os-selection == 'windows-only'
            && fromJSON('["windows-2025-vs2026"]')) ||
          fromJSON('["ubuntu-latest", "macos-latest", "windows-2025-vs2026"]') }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CUSTOM_MESSAGE: ${{ inputs.custom-message || 'Hello, World!' }}

    steps:
      - name: Record start time
        id: start
        run: echo "time=$(date +%s)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Display workflow trigger info
        run: |
          echo "=========================================="
          echo "🎯 Workflow Trigger Information"
          echo "=========================================="
          echo "Trigger: ${{ github.event_name }}"
          echo ""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "✨ This workflow was MANUALLY triggered!"
            echo ""
            echo "📋 Inputs provided:"
            echo "  • OS Selection: ${{ inputs.os-selection }}"
            echo "  • Custom Message: ${{ inputs.custom-message }}"
            echo "  • Enable Deployment: ${{ inputs.enable-deployment }}"
            echo ""
            echo "💡 TIP: You can change these inputs when manually running the workflow"
            echo "   from the Actions tab → Hello World → Run workflow button"
          else
            echo "🤖 This workflow was AUTOMATICALLY triggered by: ${{ github.event_name }}"
            echo ""
            echo "💡 TIP: To manually trigger with custom inputs:"
            echo "   1. Go to the Actions tab"
            echo "   2. Select 'Hello World' workflow"
            echo "   3. Click 'Run workflow' button"
            echo "   4. Choose your options and click 'Run workflow'"
          fi
          echo ""
          echo "🏃 Running on: ${{ matrix.os }}"
          echo "📝 Message: ${{ env.CUSTOM_MESSAGE }}"
          echo "=========================================="
        shell: bash

      - name: Set timestamp output
        id: set-output
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Say Hello
        run: echo "${{ env.CUSTOM_MESSAGE }} 👋 from ${{ matrix.os }}"

      - name: Display environment
        run: |
          echo "Running on: $(uname -a)"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
        shell: bash

      - name: Create artifact
        run: |
          echo "${{ env.CUSTOM_MESSAGE }} from ${{ runner.os }}!" > hello-${{ runner.os }}.txt
          echo "Build time: $(date)" >> hello-${{ runner.os }}.txt
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: greeting-${{ runner.os }}
          path: hello-${{ runner.os }}.txt
          retention-days: 7

      - name: Attest artifact
        uses: actions/attest-build-provenance@v4
        continue-on-error: true
        with:
          subject-path: hello-${{ runner.os }}.txt

      - name: Calculate performance metrics
        id: performance
        if: always()
        run: |
          END_TIME=$(date +%s)
          START_TIME=${{ steps.start.time }}
          DURATION=$((END_TIME - START_TIME))
          echo "duration=${DURATION}" >> $GITHUB_OUTPUT
          echo "Job duration: ${DURATION} seconds"
        shell: bash

      - name: Generate job summary
        if: always()
        run: |
          echo "## Hello World Workflow 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "**OS:** ${{ runner.os }} ${{ runner.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "**Mode:** ✨ Manual (with custom inputs)" >> $GITHUB_STEP_SUMMARY
            echo "**OS Selection:** ${{ inputs.os-selection }}" >> $GITHUB_STEP_SUMMARY
            echo "**Custom Message:** ${{ inputs.custom-message }}" >> $GITHUB_STEP_SUMMARY
            echo "**Deployment Enabled:** ${{ inputs.enable-deployment }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Mode:** 🤖 Automatic" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> 💡 **Tip:** Manually trigger this workflow from" >> $GITHUB_STEP_SUMMARY
            echo "> the Actions tab to use custom inputs!" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Duration:** ${{ steps.performance.outputs.duration }}s ⚡" >> $GITHUB_STEP_SUMMARY
        shell: bash

  combine:
    name: Combine Greetings
    needs: greet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      summary: ${{ steps.create-summary.outputs.summary }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Combine greetings
        id: create-summary
        run: |
          echo "# Combined Greetings from All Platforms" > combined.txt
          echo "" >> combined.txt
          echo "Build started at: ${{ needs.greet.outputs.timestamp }}" >> combined.txt
          echo "Run ID: ${{ needs.greet.outputs.run-id }}" >> combined.txt
          echo "" >> combined.txt
          for file in artifacts/*/hello-*.txt; do
            echo "---" >> combined.txt
            cat "$file" >> combined.txt
            echo "" >> combined.txt
          done
          cat combined.txt

          # Set output for other jobs
          echo "summary=Successfully combined greetings from all platforms" >> $GITHUB_OUTPUT

      - name: Upload combined artifact
        uses: actions/upload-artifact@v7
        with:
          name: combined-greetings
          path: combined.txt
          retention-days: 7

      - name: Summary
        run: |
          echo "## Combined Results 📦" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat combined.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  comment-pr:
    name: Comment on PR
    if: github.event_name == 'pull_request'
    needs: [greet, combine]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Download combined artifact
        uses: actions/download-artifact@v8
        with:
          name: combined-greetings

      - name: Create PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const combined = fs.readFileSync('combined.txt', 'utf8');

            const comment = `## 🎉 Hello World Workflow Complete!

            **Status:** ✅ All platforms passed
            **Run ID:** ${{ github.run_id }}
            **Timestamp:** ${{ needs.greet.outputs.timestamp }}

            <details>
            <summary>📦 Combined Greetings</summary>

            \`\`\`
            ${combined}
            \`\`\`

            </details>

            ${{ needs.combine.outputs.summary }}

            [View full workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

  notify-failure:
    name: Notify on Failure
    if: failure()
    needs: [greet, combine]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Log failure
        run: |
          echo "::error::Workflow failed! Check the logs for details."
          echo "## ❌ Workflow Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "[View failed run]($RUN_URL)" >> $GITHUB_STEP_SUMMARY

  cache-demo:
    name: Cache Demo
    needs: combine
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache demo files
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/demo
          key: demo-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            demo-cache-${{ runner.os }}-

      - name: Create cached content
        run: |
          mkdir -p ~/.cache/demo
          echo "Cached at: $(date)" > ~/.cache/demo/timestamp.txt
          echo "Run ID: ${{ github.run_id }}" >> ~/.cache/demo/timestamp.txt
          cat ~/.cache/demo/timestamp.txt

      - name: Cache summary
        run: |
          echo "## 💾 Cache Demo" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          CACHE_KEY="demo-cache-${{ runner.os }}-${{ github.run_id }}"
          echo "Demonstrated caching with key: \`$CACHE_KEY\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "In a real workflow, this would cache dependencies," >> $GITHUB_STEP_SUMMARY
          echo "build artifacts, or other reusable data." >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to Production
    if: (github.event_name == 'workflow_dispatch' && inputs.enable-deployment) || github.ref == 'refs/heads/main'
    needs: [combine, cache-demo]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://github.com/${{ github.repository }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Download combined artifact
        uses: actions/download-artifact@v8
        with:
          name: combined-greetings

      - name: Simulate deployment
        run: |
          echo "🚀 Deploying to production..."
          echo "Deployment approved and proceeding..."
          sleep 5
          echo "✅ Deployment complete!"
          cat combined.txt

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Deployed" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** ${{ needs.greet.outputs.timestamp }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This deployment required manual approval via the \`production\` environment." >> $GITHUB_STEP_SUMMARY
