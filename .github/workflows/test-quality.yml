name: Test & Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Mondays at 2 AM UTC

permissions:
  contents: read
  security-events: write
  pull-requests: write
  checks: write

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install linting tools
        run: |
          pip install pylint flake8 black isort yamllint
      
      - name: Create sample Python file
        run: |
          mkdir -p src
          cat << 'EOF' > src/sample.py
          """Sample Python module for testing."""
          
          def hello(name: str) -> str:
              """Return a greeting message."""
              return f"Hello, {name}!"
          
          
          def add(a: int, b: int) -> int:
              """Add two numbers."""
              return a + b
          
          
          if __name__ == "__main__":
              print(hello("World"))
              print(f"2 + 3 = {add(2, 3)}")
          EOF
      
      - name: Run Black formatter check
        run: |
          black --check --diff src/ || true
          echo "✅ Black formatting check complete"
      
      - name: Run isort check
        run: |
          isort --check-only --diff src/ || true
          echo "✅ isort import ordering check complete"
      
      - name: Run flake8
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true
          echo "✅ Flake8 linting complete"
      
      - name: Run pylint
        run: |
          pylint src/ --exit-zero --output-format=text || true
          echo "✅ Pylint analysis complete"
      
      - name: Lint YAML files
        run: |
          yamllint .github/workflows/ || true
          echo "✅ YAML linting complete"
      
      - name: Lint summary
        run: |
          echo "## 🔍 Code Quality Checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ All checks completed" >> $GITHUB_STEP_SUMMARY
          echo "**Checks run:**" >> $GITHUB_STEP_SUMMARY
          echo "- Black (formatting)" >> $GITHUB_STEP_SUMMARY
          echo "- isort (import ordering)" >> $GITHUB_STEP_SUMMARY
          echo "- flake8 (linting)" >> $GITHUB_STEP_SUMMARY
          echo "- pylint (static analysis)" >> $GITHUB_STEP_SUMMARY
          echo "- yamllint (workflow files)" >> $GITHUB_STEP_SUMMARY
  
  test:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025-vs2026]
        python-version: ['3.11', '3.12']
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install pytest pytest-cov pytest-xdist pytest-html
      
      - name: Create sample Python code and tests
        run: |
          mkdir -p src tests
          
          # Create main module
          cat << 'EOF' > src/calculator.py
          """Simple calculator module."""
          
          def add(a: int, b: int) -> int:
              """Add two numbers."""
              return a + b
          
          
          def subtract(a: int, b: int) -> int:
              """Subtract b from a."""
              return a - b
          
          
          def multiply(a: int, b: int) -> int:
              """Multiply two numbers."""
              return a * b
          
          
          def divide(a: float, b: float) -> float:
              """Divide a by b."""
              if b == 0:
                  raise ValueError("Cannot divide by zero")
              return a / b
          EOF
          
          # Create tests
          cat << 'EOF' > tests/test_calculator.py
          """Tests for calculator module."""
          import sys
          import os
          sys.path.insert(0, os.path.join(os.path.dirname(__file__), '..', 'src'))
          
          import pytest
          from calculator import add, subtract, multiply, divide
          
          
          def test_add():
              assert add(2, 3) == 5
              assert add(-1, 1) == 0
              assert add(0, 0) == 0
          
          
          def test_subtract():
              assert subtract(5, 3) == 2
              assert subtract(0, 5) == -5
              assert subtract(10, 10) == 0
          
          
          def test_multiply():
              assert multiply(2, 3) == 6
              assert multiply(-2, 3) == -6
              assert multiply(0, 100) == 0
          
          
          def test_divide():
              assert divide(6, 2) == 3
              assert divide(5, 2) == 2.5
              assert divide(0, 5) == 0
          
          
          def test_divide_by_zero():
              with pytest.raises(ValueError, match="Cannot divide by zero"):
                  divide(5, 0)
          EOF
          
          cat << 'EOF' > tests/conftest.py
          """Pytest configuration."""
          import pytest
          
          def pytest_configure(config):
              config.addinivalue_line(
                  "markers", "slow: marks tests as slow (deselect with '-m \"not slow\"')"
              )
          EOF
        shell: bash
      
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=html --cov-report=term --html=test-report.html --self-contained-html
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            htmlcov/
            test-report.html
            coverage.xml
          retention-days: 30
      
      - name: Test summary
        if: always()
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** ${{ runner.os }}" >> $GITHUB_STEP_SUMMARY
          echo "**Python:** ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Tests completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage reports and test results have been uploaded as artifacts." >> $GITHUB_STEP_SUMMARY
        shell: bash
  
  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
      
      - name: Security scan summary
        run: |
          echo "## 🔒 Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tool:** CodeQL" >> $GITHUB_STEP_SUMMARY
          echo "**Language:** Python" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Analysis complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the Security tab for any findings." >> $GITHUB_STEP_SUMMARY
  
  coverage-report:
    name: Combine Coverage Reports
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Download all coverage reports
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-reports
      
      - name: List downloaded files
        run: |
          echo "Downloaded coverage reports:"
          find coverage-reports -type f
      
      - name: Generate combined summary
        run: |
          echo "## 📊 Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage reports generated for:" >> $GITHUB_STEP_SUMMARY
          echo "- Ubuntu (Python 3.11, 3.12)" >> $GITHUB_STEP_SUMMARY
          echo "- macOS (Python 3.11, 3.12)" >> $GITHUB_STEP_SUMMARY
          echo "- Windows (Python 3.11, 3.12)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📁 Download the artifacts to view detailed coverage reports." >> $GITHUB_STEP_SUMMARY
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const comment = `## 📊 Test & Quality Results
            
            ✅ All quality checks and tests have passed!
            
            ### Coverage Reports
            Coverage reports are available for all platforms:
            - Ubuntu (Python 3.11, 3.12)
            - macOS (Python 3.11, 3.12)
            - Windows (Python 3.11, 3.12)
            
            Download the artifacts from the workflow run to view detailed coverage.
            
            ### Security
            CodeQL security scan completed successfully.
            
            [View full workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
