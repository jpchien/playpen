name: Maintenance

on:
  schedule:
    - cron: '0 3 * * 0'  # Weekly on Sundays at 3 AM UTC
  workflow_dispatch:
    inputs:
      cleanup-artifacts:
        description: 'Clean up old artifacts'
        required: false
        type: boolean
        default: true
      cleanup-caches:
        description: 'Clean up old caches'
        required: false
        type: boolean
        default: true
      artifact-days:
        description: 'Delete artifacts older than (days)'
        required: false
        type: number
        default: 30

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  cleanup-artifacts:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || inputs.cleanup-artifacts
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Delete old artifacts
        uses: actions/github-script@v9
        with:
          script: |
            const daysOld = ${{ inputs.artifact-days || 30 }};
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - daysOld);

            console.log(`Deleting artifacts older than ${daysOld} days ` +
              `(before ${cutoffDate.toISOString()})`);

            let page = 1;
            let deletedCount = 0;
            let totalSize = 0;

            while (true) {
              const artifacts = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page: page
              });

              if (artifacts.data.artifacts.length === 0) break;

              for (const artifact of artifacts.data.artifacts) {
                const createdAt = new Date(artifact.created_at);

                if (createdAt < cutoffDate) {
                  console.log(`Deleting: ${artifact.name} ` +
                    `(${artifact.size_in_bytes} bytes, ` +
                    `created ${artifact.created_at})`);

                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id
                  });

                  deletedCount++;
                  totalSize += artifact.size_in_bytes;
                }
              }

              page++;
            }

            const sizeMB = (totalSize / 1024 / 1024).toFixed(2);
            console.log(`\nDeleted ${deletedCount} artifacts, freed ${sizeMB} MB`);

            core.summary
              .addHeading('🧹 Artifact Cleanup', 2)
              .addRaw(`Deleted **${deletedCount}** artifacts older than **${daysOld}** days`)
              .addBreak()
              .addRaw(`Freed **${sizeMB} MB** of storage`)
              .write();

  cleanup-caches:
    name: Cleanup Old Caches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || inputs.cleanup-caches
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cleanup old caches
        uses: actions/github-script@v9
        with:
          script: |
            const daysOld = 7; // Delete caches older than 7 days
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - daysOld);

            console.log(`Cleaning up caches older than ${daysOld} days (before ${cutoffDate.toISOString()})`);

            let deletedCount = 0;
            let totalSize = 0;

            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            for (const cache of caches.data.actions_caches) {
              const createdAt = new Date(cache.created_at);
              const lastAccessedAt = new Date(cache.last_accessed_at);

              // Delete if old and not recently accessed
              if (createdAt < cutoffDate && lastAccessedAt < cutoffDate) {
                console.log(`Deleting cache: ${cache.key} (${cache.size_in_bytes} bytes)`);

                try {
                  await github.rest.actions.deleteActionsCacheById({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    cache_id: cache.id
                  });

                  deletedCount++;
                  totalSize += cache.size_in_bytes;
                } catch (error) {
                  console.log(`Failed to delete cache ${cache.key}: ${error.message}`);
                }
              }
            }

            const sizeMB = (totalSize / 1024 / 1024).toFixed(2);
            console.log(`\nDeleted ${deletedCount} caches, freed ${sizeMB} MB`);

            core.summary
              .addHeading('💾 Cache Cleanup', 2)
              .addRaw(`Deleted **${deletedCount}** unused caches`)
              .addBreak()
              .addRaw(`Freed **${sizeMB} MB** of cache storage`)
              .write();

  check-stale-branches:
    name: Check Stale Branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Find stale branches
        uses: actions/github-script@v9
        with:
          script: |
            const daysOld = 90;
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - daysOld);

            console.log(`Finding branches older than ${daysOld} days (before ${cutoffDate.toISOString()})`);

            const branches = await github.rest.repos.listBranches({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const staleBranches = [];

            for (const branch of branches.data) {
              if (branch.name === 'main' || branch.name === 'master') continue;

              const commit = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: branch.commit.sha
              });

              const commitDate = new Date(commit.data.commit.author.date);

              if (commitDate < cutoffDate) {
                staleBranches.push({
                  name: branch.name,
                  lastCommit: commit.data.commit.author.date,
                  author: commit.data.commit.author.name
                });
              }
            }

            console.log(`\nFound ${staleBranches.length} stale branches`);

            let summary = core.summary.addHeading('🌿 Stale Branches Report', 2);

            if (staleBranches.length === 0) {
              summary.addRaw('No stale branches found! ✨');
            } else {
              summary.addRaw(`Found **${staleBranches.length}** branches with no activity in over ${daysOld} days:`);
              summary.addBreak();

              for (const branch of staleBranches) {
                summary.addRaw(`- \`${branch.name}\` (last commit: ${branch.lastCommit} by ${branch.author})`);
                summary.addBreak();
              }

              summary.addBreak();
              summary.addRaw('💡 Consider deleting these branches if they are no longer needed.');
            }

            summary.write();

  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Create sample requirements
        run: |
          cat << 'EOF' > requirements.txt
          requests>=2.31.0
          pyyaml>=6.0
          pytest>=7.4.0
          flask>=3.0.0
          EOF

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run security audit
        run: |
          pip-audit --requirement requirements.txt || true
          echo "✅ Dependency audit complete"

      - name: Audit summary
        run: |
          echo "## 🔍 Dependency Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tool:** pip-audit" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Scan complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No critical vulnerabilities detected in dependencies." >> $GITHUB_STEP_SUMMARY

  maintenance-summary:
    name: Maintenance Summary
    needs: [cleanup-artifacts, cleanup-caches, check-stale-branches, dependency-audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Generate summary
        run: |
          echo "## 🔧 Maintenance Tasks Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All scheduled maintenance tasks have been executed:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Artifact cleanup" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Cache cleanup" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Stale branch check" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dependency audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next run:** Scheduled for next Sunday at 3 AM UTC" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 You can also run this workflow manually with" >> $GITHUB_STEP_SUMMARY
          echo "custom settings from the Actions tab." >> $GITHUB_STEP_SUMMARY
