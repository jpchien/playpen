name: Weather App - Code Quality

on:
  push:
    branches: [ main ]
    paths:
      - 'weather_app/**'
      - '.github/workflows/weather-app-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'weather_app/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint & Style Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install linting tools
        run: |
          pip install pylint flake8 black isort

      - name: Run Black formatter check
        run: |
          black --check --diff weather_app/*.py || true
          echo "✅ Black formatting check complete"

      - name: Run isort check
        run: |
          isort --check-only --diff weather_app/*.py || true
          echo "✅ isort import ordering check complete"

      - name: Run flake8
        run: |
          flake8 weather_app/*.py --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 weather_app/*.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true
          echo "✅ Flake8 linting complete"

      - name: Run pylint
        run: |
          pylint weather_app/*.py --exit-zero --output-format=text || true
          echo "✅ Pylint analysis complete"

      - name: Lint summary
        run: |
          echo "## 🔍 Weather App Code Quality" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ All checks completed" >> $GITHUB_STEP_SUMMARY
          echo "**Files checked:** weather_app/*.py" >> $GITHUB_STEP_SUMMARY

  syntax-check:
    name: Python Syntax Check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check Python syntax
        run: |
          python -m py_compile weather_app/*.py
          echo "✅ Syntax check passed for Python ${{ matrix.python-version }} on ${{ matrix.os }}"

      - name: Test imports
        run: |
          cd weather_app
          python -c "import api_client; import config; import display; print('✅ All modules import successfully')"

  help-check:
    name: Test CLI Help
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test help command
        run: |
          cd weather_app
          python weather.py --help
          echo "✅ Help command works"

      - name: Test list-favorites (no config)
        run: |
          cd weather_app
          python weather.py --list-favorites || true
          echo "✅ List favorites works without config"

      - name: Summary
        run: |
          echo "## 🌤️ Weather App CLI Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Help command functional" >> $GITHUB_STEP_SUMMARY
          echo "✅ Handles missing configuration gracefully" >> $GITHUB_STEP_SUMMARY
